<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil | Astro Notlarım</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-remote-config-compat.js"></script>
    <script src="firebase-service.js"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .profile-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .profile-header-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 24px 20px;
            background-color: #ffffff;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #f3f4f6;
        }
        .profile-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background-color: #000000;
            color: #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .profile-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #111111;
            margin-bottom: 4px;
        }
        .profile-email {
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .section-card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #f3f4f6;
        }
        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 12px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 0.9rem;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #6b7280; }
        .info-value { color: #111111; font-weight: 600; text-align: right; }

        .action-btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
            transition: opacity 0.2s;
        }
        .action-btn:active { opacity: 0.8; }
        .action-btn.primary { background-color: #000000; color: #d4af37; }
        .action-btn.secondary { background-color: #f9fafb; color: #374151; border: 1px solid #e5e7eb; }
        .action-btn.danger { background-color: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: #9ca3af;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="brand-section app-header">
            <button class="btn-menu" onclick="toggleMenu()">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <h1>Profil</h1>
        </header>

        <main class="profile-content" id="profileContent">
            <div class="profile-header-card">
                <div class="profile-avatar" id="avatarInitial">?</div>
                <div class="profile-name" id="profileName">Yükleniyor...</div>
                <div class="profile-email" id="profileEmail"></div>
            </div>

            <div class="section-card" id="birthInfoCard" style="display:none;">
                <div class="section-title">Doğum Bilgileri</div>
                <div class="info-row">
                    <span class="info-label">Doğum Tarihi</span>
                    <span class="info-value" id="infoBirthDate">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Doğum Saati</span>
                    <span class="info-value" id="infoBirthTime">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Doğum Yeri</span>
                    <span class="info-value" id="infoBirthPlace">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Güneş Burcu</span>
                    <span class="info-value" id="infoSunSign">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Ay Burcu</span>
                    <span class="info-value" id="infoMoonSign">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Yükselen</span>
                    <span class="info-value" id="infoRisingSign">-</span>
                </div>
            </div>

            <div class="section-card" id="noBirthInfoCard" style="display:none;">
                <div class="empty-state">Doğum bilgileriniz henüz kayıtlı değil.</div>
                <button class="action-btn primary" onclick="window.location.href='birthinfo.html'">Doğum Bilgilerini Ekle</button>
            </div>

            <div class="section-card">
                <div class="section-title">Hesap</div>
                <button class="action-btn secondary" onclick="window.location.href='birthinfo.html'">Doğum Bilgilerini Güncelle</button>
                <button class="action-btn danger" onclick="handleDeleteAccount()">Hesabımı Sil</button>
            </div>
        </main>

        <footer class="bottom-navbar">
            <a href="dashboard.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span class="nav-label">Anasayfa</span>
            </a>
            <a href="ask.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span class="nav-label">Sor</span>
            </a>
            <a href="natal.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M4.5 8h15"></path><path d="M4.5 16h15"></path></svg>
                <span class="nav-label">Harita</span>
            </a>
        </footer>
    </div>

    <!-- Side Menu -->
    <div id="sideMenu" class="side-menu" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;" onclick="toggleMenu()">
        <div class="side-menu-panel" style="position:fixed;top:0;left:0;width:280px;height:100%;background:#1a1a2e;padding:20px;transform:translateX(-100%);transition:transform 0.3s ease;" onclick="event.stopPropagation()">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;">
                <h2 style="color:#d4af37;font-size:1.2rem;margin:0;">Menü</h2>
                <button onclick="toggleMenu()" style="background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;">×</button>
            </div>
            <nav style="display:flex;flex-direction:column;gap:16px;">
                <a href="dashboard.html" style="color:#e5e7eb;text-decoration:none;font-size:1rem;display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;transition:background 0.2s;" onmouseover="this.style.background='#2d2d44'" onmouseout="this.style.background='transparent'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Anasayfa
                </a>
                <a href="natal.html" style="color:#e5e7eb;text-decoration:none;font-size:1rem;display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;transition:background 0.2s;" onmouseover="this.style.background='#2d2d44'" onmouseout="this.style.background='transparent'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M4.5 8h15"></path><path d="M4.5 16h15"></path></svg>
                    Doğum Haritası
                </a>
                <a href="ask.html" style="color:#e5e7eb;text-decoration:none;font-size:1rem;display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;transition:background 0.2s;" onmouseover="this.style.background='#2d2d44'" onmouseout="this.style.background='transparent'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Sor
                </a>
                <a href="profile.html" style="color:#d4af37;text-decoration:none;font-size:1rem;display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;background:#2d2d44;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Profil
                </a>
                <a href="#" onclick="AstroService.logout().then(() => window.location.href='login.html'); return false;" style="color:#ef4444;text-decoration:none;font-size:1rem;display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;transition:background 0.2s;" onmouseover="this.style.background='#2d2d44'" onmouseout="this.style.background='transparent'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Çıkış Yap
                </a>
            </nav>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            const panel = menu.querySelector('.side-menu-panel');
            const isOpen = menu.style.display === 'block';
            if (isOpen) {
                panel.style.transform = 'translateX(-100%)';
                setTimeout(() => { menu.style.display = 'none'; }, 300);
            } else {
                menu.style.display = 'block';
                requestAnimationFrame(() => { panel.style.transform = 'translateX(0)'; });
            }
        }

        const MONTH_NAMES = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];

        AstroService.onAuthStateChanged((user) => {
            loadProfile(user);
        }, () => {
            window.location.href = 'login.html';
        });

        async function loadProfile(user) {
            try {
                const data = await AstroService.getUserProfile(user.uid);
                const fullname = data?.fullname || user.displayName || 'Kullanıcı';
                const email = data?.email || user.email || '';

                document.getElementById('profileName').textContent = fullname;
                document.getElementById('profileEmail').textContent = email;
                document.getElementById('avatarInitial').textContent = fullname.trim().charAt(0).toUpperCase() || '?';

                if (data && data.birthYear) {
                    document.getElementById('birthInfoCard').style.display = 'block';
                    document.getElementById('noBirthInfoCard').style.display = 'none';

                    const monthName = MONTH_NAMES[(data.birthMonth || 1) - 1] || '-';
                    document.getElementById('infoBirthDate').textContent = `${data.birthDay} ${monthName} ${data.birthYear}`;
                    document.getElementById('infoBirthTime').textContent =
                        `${String(data.birthHour).padStart(2, '0')}:${String(data.birthMinute).padStart(2, '0')}`;
                    document.getElementById('infoBirthPlace').textContent = data.birthPlace || '-';
                    document.getElementById('infoSunSign').textContent = data.sunSign || '-';
                    document.getElementById('infoMoonSign').textContent = data.moonSign || '-';
                    document.getElementById('infoRisingSign').textContent = data.risingSign || '-';
                } else {
                    document.getElementById('birthInfoCard').style.display = 'none';
                    document.getElementById('noBirthInfoCard').style.display = 'block';
                }
            } catch (err) {
                console.error('Profil yükleme hatası:', err);
                document.getElementById('profileName').textContent = user.displayName || 'Kullanıcı';
            }
        }

        async function handleDeleteAccount() {
            const confirmed = confirm('Hesabınızı ve tüm verilerinizi kalıcı olarak silmek istediğinize emin misiniz? Bu işlem geri alınamaz.');
            if (!confirmed) return;

            try {
                await AstroService.deleteCurrentUser();
                window.location.href = 'register.html';
            } catch (err) {
                console.error('Hesap silme hatası:', err);
                if (err.code === 'auth/requires-recent-login') {
                    alert('Güvenlik nedeniyle hesabınızı silmeden önce tekrar giriş yapmanız gerekiyor.');
                    await AstroService.logout();
                    window.location.href = 'login.html';
                } else {
                    alert('Hesap silinirken bir hata oluştu: ' + err.message);
                }
            }
        }
    </script>
</body>
</html>
