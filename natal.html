<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-page-title="natal.title">Doğum Haritası | Astro Notlarim</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-remote-config-compat.js"></script>
    <script src="firebase-service.js"></script>
    <script src="i18n.js"></script>
    <script src="astro-calculator.js"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
        
        .natal-content { 
            flex: 1; 
            overflow-y: auto; 
            padding: 16px; 
            -webkit-overflow-scrolling: touch; 
            background-color: #f9fafb;
        }
        .natal-content::-webkit-scrollbar { width: 4px; }
        .natal-content::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

        /* ─── Burç Kartları ─── */
        .signs-container { display: flex; flex-direction: column; gap: 12px; }
        
        .sign-card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            border: 1px solid #f3f4f6;
        }
        .sign-card.empty { opacity: 0.7; }
        
        .sign-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .sign-icon-circle {
            width: 40px; 
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }
        .sign-icon-circle.aries { background: #fee2e2; }
        .sign-icon-circle.taurus { background: #fef3c7; }
        .sign-icon-circle.gemini { background: #ede9fe; }
        .sign-icon-circle.cancer { background: #dbeafe; }
        .sign-icon-circle.leo { background: #ffedd5; }
        .sign-icon-circle.virgo { background: #d1fae5; }
        .sign-icon-circle.libra { background: #fce7f3; }
        .sign-icon-circle.scorpio { background: #fecaca; }
        .sign-icon-circle.sagittarius { background: #c7d2fe; }
        .sign-icon-circle.capricorn { background: #e5e7eb; }
        .sign-icon-circle.aquarius { background: #a5f3fc; }
        .sign-icon-circle.pisces { background: #ddd6fe; }
        
        .sign-name { 
            font-size: 1.1rem; 
            font-weight: 700; 
            color: #111827; 
            flex: 1; 
        }
        .planet-count-badge {
            background: #f3f4f6;
            color: #6b7280;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .sign-planets { display: flex; flex-direction: column; gap: 8px; }
        
        .no-planet {
            color: #9ca3af;
            font-size: 0.9rem;
            padding: 8px 0;
        }
        
        .planet-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
            background: #f9fafb;
        }
        .planet-item:active { transform: scale(0.98); }
        .planet-item:hover { background: #f3f4f6; }
        .planet-item.fixed-star { background: #fffbeb; border: 1px solid #fef3c7; }
        .planet-item.calculated { background: #f0fdf4; border: 1px solid #bbf7d0; }
        
        .planet-symbol {
            width: 28px; 
            height: 28px;
            border-radius: 50%;
            background: #000000;
            color: #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .planet-item.fixed-star .planet-symbol { background: #d4af37; color: #000000; }
        .planet-item.calculated .planet-symbol { background: #d4af37; color: #000000; }
        
        .planet-info { flex: 1; display: flex; flex-direction: column; }
        .planet-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .planet-name {
            font-weight: 600;
            color: #111827;
            font-size: 0.95rem;
        }
        .planet-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .planet-badge.retro { background: #fef2f2; color: #dc2626; }
        .planet-badge.star { background: #fffbeb; color: #d97706; }
        .planet-badge.calc { background: #f0fdf4; color: #16a34a; }
        
        .planet-degree {
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: 2px;
        }
        
        /* ─── Bottom Sheet ─── */
        .bottom-sheet-overlay {
            display: none;
            position: fixed;
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
        }
        .bottom-sheet-overlay.show { display: flex; }
        
        .bottom-sheet-panel {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            max-height: 75vh;
            border-radius: 20px 20px 0 0;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            display: flex;
            flex-direction: column;
        }
        .bottom-sheet-overlay.show .bottom-sheet-panel {
            transform: translateY(0);
        }
        
        .bottom-sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #f3f4f6;
            flex-shrink: 0;
        }
        .bottom-sheet-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bottom-sheet-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #9ca3af;
            cursor: pointer;
            padding: 4px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .bottom-sheet-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 24px;
            -webkit-overflow-scrolling: touch;
        }
        
        /* ─── Yorum Kategorileri ─── */
        .comment-section {
            margin-bottom: 16px;
        }
        .comment-section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid #fef3c7;
        }
        .comment-item {
            background: #f9fafb;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
        }
        .comment-item-title {
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }
        .comment-item-body {
            font-size: 0.85rem;
            color: #4b5563;
            line-height: 1.5;
        }
        
        .no-comments {
            text-align: center;
            color: #9ca3af;
            padding: 40px 20px;
        }
        .no-comments-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        /* ─── Evler Bölümü ─── */
        .houses-section {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .houses-section-title {
            font-size: 1rem;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 12px;
        }
        .house-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 0.9rem;
        }
        .house-row:last-child { border-bottom: none; }
        .house-number { font-weight: 600; color: #111827; }
        .house-sign { color: #6b7280; }

        /* ─── Açılar Bölümü ─── */
        .aspects-section {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .aspect-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 0.9rem;
        }
        .aspect-type {
            background: #f3f4f6;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #d4af37;
        }

        .empty-state { text-align: center; padding: 40px 20px; color: #9ca3af; }
    </style>
</head>
<body>

    <!-- Bottom Sheet -->
    <div id="bottomSheet" class="bottom-sheet-overlay" onclick="closeBottomSheet(event)">
        <div class="bottom-sheet-panel" onclick="event.stopPropagation()">
            <div class="bottom-sheet-header">
                <h3 id="bsTitle">

    <div id="sideMenu" class="side-menu" onclick="toggleMenu()">

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;">
                <h2 style="color:#d4af37;font-size:1.2rem;margin:0;" data-i18n="nav.menu">Menu</h2>
                <button onclick="toggleMenu()" style="background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;">&times;</button>
            </div>
            <nav style="display:flex;flex-direction:column;gap:16px;">
                <a onclick="goToPage('dashboard.html')" style="color:#e5e7eb;text-decoration:none;font-size:1rem;display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;transition:background 0.2s;cursor:pointer;" onmouseover="this.style.background='#2d2d44'" onmouseout="this.style.background='transparent'">

                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>

                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>

    <script>
        // ─── Global chart verisi ───
        let currentChartData = null;

        function goToPage(page) { window.location.href = page; }
        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('show'); }

        // ─── Auth kontrolü ───
        AstroService.onAuthStateChanged((user) => {
            if (user) { loadNatalChart(user); } 
            else { window.location.replace('login.html'); }
        });

        // ─── Haritayı yükle ───
        async function loadNatalChart(user) {
            try {
                const rawChart = await AstroService.getNatalChart(user.uid);
                if (!rawChart) {
                    showEmptyState(i18n.t('natal.notFound'));
                    return;
                }

                // Eksik verileri client-side hesapla
                currentChartData = AstroCalculator.enrichChartData(rawChart);
                
                renderNatalChart(currentChartData);
            } catch (err) {
                console.error('Harita yükleme hatası:', err);
                showEmptyState(i18n.t('natal.loadingError'));
            }
        }

        function showEmptyState(message) {
            document.getElementById('natalContent').innerHTML = 
                `<div class="empty-state"><p>${AstroService.escapeHtml(message)}</p></div>`;
        }

        // ─── Ana render fonksiyonu ───
        function renderNatalChart(chart) {
            const content = document.getElementById('natalContent');
            const esc = AstroService.escapeHtml;
            
            let html = '';

            // 1. EVLER BÖLÜMÜ (Kısa özet)
            if (chart.houses && chart.houses.length > 0) {
                html += renderHousesSection(chart.houses);
            }

            // 2. BURÇ KARTLARI
            const planetsBySign = AstroCalculator.groupBySign(chart.planets || []);
            html += renderSignCards(planetsBySign);

            // 3. AÇILAR (Opsiyonel - daraltılabilir)
            if (chart.aspects && chart.aspects.length > 0) {
                html += renderAspectsSection(chart.aspects);
            }

            content.innerHTML = html;
        }

        // ─── Evler bölümü ───
        function renderHousesSection(houses) {
            const esc = AstroService.escapeHtml;
            let html = '<div class="houses-section">';
            html += `<div class="houses-section-title">${esc(i18n.t('natal.houses'))}</div>`;
            
            houses.forEach((h, i) => {
                const signName = i18n.translateSign(h.sign_id || h.sign) || '-';
                const deg = typeof h.pos === 'number' ? h.pos.toFixed(1) + '°' : '';
                const houseNum = h.house || (i + 1);
                
                // Özel marker'lar
                let marker = '';
                if (houseNum === 1) marker = ' ' + i18n.t('natal.ascMarker');
                else if (houseNum === 10) marker = ' ' + i18n.t('natal.mcMarker');
                else if (houseNum === 7) marker = ' ' + i18n.t('natal.dcMarker');
                else if (houseNum === 4) marker = ' ' + i18n.t('natal.icMarker');
                
                html += `
                    <div class="house-row">
                        <span class="house-number">${houseNum}. ${esc(i18n.t('natal.houseSuffixShort'))}${esc(marker)}</span>
                        <span class="house-sign">${esc(signName)} ${esc(deg)}</span>
                    </div>
                `;
            });
            
            html += '</div>';
            return html;
        }

        // ─── Burç kartları ───
        function renderSignCards(planetsBySign) {
            const esc = AstroService.escapeHtml;
            const signOrder = AstroCalculator.SIGNS.map(s => s.id);
            
            let html = '<div class="signs-container">';
            
            signOrder.forEach(signId => {
                const planets = planetsBySign[signId] || [];
                const signInfo = AstroCalculator.SIGNS.find(s => s.id === signId);
                const signName = i18n.translateSign(signId);
                const count = planets.length;
                
                const isEmpty = count === 0;
                
                html += `
                    <div class="sign-card ${isEmpty ? 'empty' : ''}" data-sign="${esc(signId)}">
                        <div class="sign-header">
                            <div class="sign-icon-circle ${esc(signId)}">
                                ${signInfo.symbol}
                            </div>
                            <span class="sign-name">${esc(signName)}</span>
                            <span class="planet-count-badge">${count} ${esc(i18n.t('natal.planetCountZero'))}</span>
                        </div>
                        <div class="sign-planets">
                `;
                
                if (isEmpty) {
                    html += `<span class="no-planet">${esc(i18n.t('natal.noPlanet'))}</span>`;
                } else {
                    planets.forEach(p => {
                        html += renderPlanetItem(p);
                    });
                }
                
                html += '</div></div>';
            });
            
            html += '</div>';
            return html;
        }

        // ─── Tek gezegen satırı ───
        function renderPlanetItem(p) {
            const esc = AstroService.escapeHtml;
            const symbol = AstroCalculator.getSymbol(p.id);
            const name = p.isFixedStar ? p.name : i18n.translatePlanet(p.id);
            const retro = p.retrograde ? `<span class="planet-badge retro">R</span>` : '';
            const starBadge = p.isFixedStar ? `<span class="planet-badge star">★</span>` : '';
            const calcBadge = p.isCalculated ? `<span class="planet-badge calc">⊕</span>` : '';
            
            const deg = Math.round(p.pos || p.degree || 0);
            const house = p.house ? `${p.house}. ${i18n.t('natal.houseSuffixShort')}` : '';
            
            // Özel ev marker'ları
            let houseMarker = '';
            if (p.house === 1) houseMarker = ' (ASC)';
            else if (p.house === 10) houseMarker = ' (MC)';
            else if (p.house === 7) houseMarker = ' (DC)';
            else if (p.house === 4) houseMarker = ' (IC)';
            
            const extraClass = p.isFixedStar ? 'fixed-star' : (p.isCalculated ? 'calculated' : '');
            
            return `
                <div class="planet-item ${extraClass}" onclick="showPlanetDetail('${esc(p.id)}')" data-planet-id="${esc(p.id)}">
                    <div class="planet-symbol">${symbol}</div>
                    <div class="planet-info">
                        <div class="planet-name-row">
                            <span class="planet-name">${esc(name)}</span>
                            ${retro}${starBadge}${calcBadge}
                        </div>
                        <div class="planet-degree">${deg}° ${esc(house)}${esc(houseMarker)}</div>
                    </div>
                </div>
            `;
        }

        // ─── Açılar bölümü ───
        function renderAspectsSection(aspects) {
            const esc = AstroService.escapeHtml;
            let html = '<div class="aspects-section">';
            html += `<div class="houses-section-title">${esc(i18n.t('natal.aspects'))}</div>`;
            
            // Sadece major aspects göster, max 10 tane
            const majorAspects = aspects
                .filter(a => a.is_major !== false)
                .slice(0, 10);
            
            majorAspects.forEach(a => {
                const p1 = i18n.translatePlanet(a.p1 || a.planet1);
                const p2 = i18n.translatePlanet(a.p2 || a.planet2);
                const type = i18n.translateAspect(a.type);
                
                html += `
                    <div class="aspect-row">
                        <span>${esc(p1)} - ${esc(p2)}</span>
                        <span class="aspect-type">${esc(type)}</span>
                    </div>
                `;
            });
            
            html += '</div>';
            return html;
        }

        // ─── Bottom Sheet: Gezegen detayı ───
        function showPlanetDetail(planetId) {
            if (!currentChartData) return;
            
            const planet = currentChartData.planets.find(p => p.id === planetId);
            if (!planet) return;
            
            const bs = document.getElementById('bottomSheet');
            const symbolEl = document.getElementById('bsSymbol');
            const nameEl = document.getElementById('bsPlanetName');
            const body = document.getElementById('bsBody');
            
            // Başlık
            symbolEl.textContent = AstroCalculator.getSymbol(planetId);
            const name = planet.isFixedStar ? planet.name : i18n.translatePlanet(planetId);
            nameEl.textContent = name;
            
            // Yorumları bul
            const comments = findCommentsForPlanet(planetId);
            
            if (comments.length === 0) {
                body.innerHTML = `
                    <div class="no-comments">
                        <div class="no-comments-icon">🔮</div>
                        <p>${AstroService.escapeHtml(i18n.t('natal.noComments'))}</p>
                    </div>
                `;
            } else {
                body.innerHTML = renderComments(comments);
            }
            
            bs.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        // ─── Yorumları bul ───
        function findCommentsForPlanet(planetId) {
            const interpretations = currentChartData.interpretation?.sections || {};
            const results = [];
            
            // 6 kategori
            const categoryMap = {
                'core_self': i18n.t('dashboard.coreSelf'),
                'mind': i18n.t('dashboard.mind'),
                'love_relating': i18n.t('dashboard.loveRelating'),
                'work_path': i18n.t('dashboard.workPath'),
                'social_collective': i18n.t('dashboard.socialCollective'),
                'karmic_healing': i18n.t('dashboard.karmicHealing')
            };
            
            Object.entries(interpretations).forEach(([catKey, items]) => {
                if (!Array.isArray(items)) return;
                
                items.forEach(item => {
                    // Tags kontrolü
                    if (item.tags && item.tags.includes(planetId)) {
                        results.push({
                            category: categoryMap[catKey] || catKey,
                            title: item.title,
                            body: item.body
                        });
                    }
                    // Key kontrolü (planet.id içeriyor mu?)
                    else if (item.key && item.key.includes(planetId)) {
                        results.push({
                            category: categoryMap[catKey] || catKey,
                            title: item.title,
                            body: item.body
                        });
                    }
                });
            });
            
            return results;
        }

        // ─── Yorumları render et ───
        function renderComments(comments) {
            const esc = AstroService.escapeHtml;
            
            // Kategoriye göre grupla
            const byCategory = {};
            comments.forEach(c => {
                if (!byCategory[c.category]) byCategory[c.category] = [];
                byCategory[c.category].push(c);
            });
            
            let html = '';
            Object.entries(byCategory).forEach(([cat, items]) => {
                html += `<div class="comment-section">`;
                html += `<div class="comment-section-title">${esc(cat)}</div>`;
                
                items.forEach(item => {
                    html += `
                        <div class="comment-item">
                            <div class="comment-item-title">${esc(item.title)}</div>
                            <div class="comment-item-body">${esc(item.body)}</div>
                        </div>
                    `;
                });
                
                html += '</div>';
            });
            
            return html;
        }

        // ─── Bottom Sheet kapat ───
        function closeBottomSheet(event) {
            if (!event || event.target.id === 'bottomSheet') {
                document.getElementById('bottomSheet').classList.remove('show');
                document.body.style.overflow = '';
            }
        }
    </script>
</body>
</html>
