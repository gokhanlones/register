<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-page-title="natal.title">Dogum Haritasi | Astro Notlarim</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-remote-config-compat.js"></script>
    <script src="firebase-service.js"></script>
    <script src="i18n.js"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
        
        .natal-content { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            -webkit-overflow-scrolling: touch; 
        }
        .natal-content::-webkit-scrollbar { width: 4px; }
        .natal-content::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

        .section-card { 
            background-color: #ffffff; 
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 16px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
            border: 1px solid #f3f4f6; 
        }
        .section-title { 
            font-size: 1.1rem; 
            font-weight: 700; 
            color: #d4af37; 
            margin-bottom: 12px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .chart-image-wrapper { 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            margin-bottom: 16px; 
            background-color: #f9fafb; 
            border-radius: 16px; 
            padding: 16px; 
            border: 1px solid #f3f4f6; 
        }
        .chart-image-wrapper img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 12px; 
        }

        /* ─── TIKLANABİLİR GEZEGEN SATIRLARI ─── */
        .planet-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 0; 
            border-bottom: 1px solid #f3f4f6; 
            cursor: pointer; 
            transition: background-color 0.15s;
            margin: 0 -8px;
            padding-left: 8px;
            padding-right: 8px;
            border-radius: 8px;
        }
        .planet-row:last-child { border-bottom: none; }
        .planet-row:active { background-color: #f3f4f6; }
        .planet-row:hover { background-color: #f9fafb; }

        .planet-name-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .planet-icon {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #d4af37;
            flex-shrink: 0;
        }
        .planet-name {
            font-weight: 600;
            color: #111827;
            font-size: 0.95rem;
        }
        .planet-details {
            color: #6b7280;
            font-size: 0.85rem;
            text-align: right;
        }
        .planet-chevron {
            width: 16px;
            height: 16px;
            color: #d1d5db;
            margin-left: 4px;
            flex-shrink: 0;
        }

        .house-row { 
            padding: 10px 0; 
            border-bottom: 1px solid #f3f4f6; 
            font-size: 0.95rem; 
            color: #374151; 
        }
        .house-row:last-child { border-bottom: none; }

        .sign-header { 
            font-weight: 700; 
            color: #d4af37; 
            margin: 16px 0 8px 0; 
            padding-bottom: 4px; 
            border-bottom: 1px solid #d4af37; 
            font-size: 1rem; 
        }

        .empty-state { 
            text-align: center; 
            padding: 40px 20px; 
            color: #9ca3af; 
        }

        /* ─── BOTTOM SHEET ─── */
        .bottom-sheet-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
        }
        .bottom-sheet-overlay.show {
            display: flex;
        }
        .bottom-sheet {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 20px 20px 0 0;
            max-height: 75vh;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
        }
        .bottom-sheet-overlay.show .bottom-sheet {
            transform: translateY(0);
        }

        .bottom-sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 12px;
            border-bottom: 1px solid #f3f4f6;
            flex-shrink: 0;
        }
        .bottom-sheet-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #111827;
        }
        .bottom-sheet-close {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: #9ca3af;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .bottom-sheet-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 24px;
            -webkit-overflow-scrolling: touch;
        }

        /* ─── KATEGORİ YORUM KARTLARI ─── */
        .category-section {
            margin-bottom: 20px;
        }
        .category-section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #f3f4f6;
        }
        .interp-card {
            background-color: #f9fafb;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 1px solid #f3f4f6;
        }
        .interp-card-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 6px;
        }
        .interp-card-body {
            font-size: 0.9rem;
            color: #4b5563;
            line-height: 1.6;
        }
        .no-interpretation {
            text-align: center;
            padding: 30px 20px;
            color: #9ca3af;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="brand-section app-header">
            <button class="btn-menu" onclick="toggleMenu()">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <h1>Astro Notlarim</h1>
        </header>

        <main class="natal-content" id="natalContent">
            <div class="empty-state">
                <p data-i18n="natal.loading">Dogum haritasi yukleniyor...</p>
            </div>
        </main>

        <footer class="bottom-navbar">
            <a href="dashboard.html" class="nav-item" onclick="event.preventDefault(); goToPage('dashboard.html');">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span class="nav-label" data-i18n="nav.home">Anasayfa</span>
            </a>
            <a href="ask.html" class="nav-item" onclick="event.preventDefault(); goToPage('ask.html');">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span class="nav-label" data-i18n="nav.ask">Sor</span>
            </a>
            <a href="natal.html" class="nav-item active" onclick="event.preventDefault(); goToPage('natal.html');">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M4.5 8h15"></path><path d="M4.5 16h15"></path></svg>
                <span class="nav-label" data-i18n="nav.chart">Harita</span>
            </a>
        </footer>
    </div>

    <!-- ─── BOTTOM SHEET ─── -->
    <div id="bottomSheetOverlay" class="bottom-sheet-overlay" onclick="closeBottomSheet(event)">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="bottom-sheet-header">
                <div class="bottom-sheet-title" id="bottomSheetTitle">Yorumlar</div>
                <button class="bottom-sheet-close" onclick="closeBottomSheet()">&times;</button>
            </div>
            <div class="bottom-sheet-body" id="bottomSheetBody">
                <!-- İçerik dinamik -->
            </div>
        </div>
    </div>

    <!-- Side Menu -->
    <div id="sideMenu" class="side-menu" onclick="toggleMenu()">
        <div class="side-menu-panel" onclick="event.stopPropagation()">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;">
                <h2 style="color:#d4af37;font-size:1.2rem;margin:0;" data-i18n="nav.menu">Menu</h2>
                <button onclick="toggleMenu()" style="background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;">&times;</button>
            </div>
            <nav style="display:flex;flex-direction:column;gap:16px;">
                <a onclick="goToPage('dashboard.html')" style="color:#e5e7eb;text-decoration:none;font-size:1rem;display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;transition:background 0.2s;cursor:pointer;" onmouseover="this.style.background='#2d2d44'" onmouseout="this.style.background='transparent'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    <span data-i18n="menu.home">Anasayfa</span>
                </a>
                <a onclick="goToPage('natal.html')" style="color:#d4af37;text-decoration:none;font-size:1rem;display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;background:#2d2d44;cursor:pointer;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M4.5 8h15"></path><path d="M4.5 16h15"></path></svg>
                    <span data-i18n="menu.natalChart">Dogum Haritasi</span>
                </a>
                <a onclick="goToPage('ask.html')" style="color:#e5e7eb;text-decoration:none;font-size:1rem;display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;transition:background 0.2s;cursor:pointer;" onmouseover="this.style.background='#2d2d44'" onmouseout="this.style.background='transparent'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <span data-i18n="menu.ask">Sor</span>
                </a>
                <a onclick="goToPage('profile.html')" style="color:#e5e7eb;text-decoration:none;font-size:1rem;display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;transition:background 0.2s;cursor:pointer;" onmouseover="this.style.background='#2d2d44'" onmouseout="this.style.background='transparent'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span data-i18n="menu.profile">Profil</span>
                </a>
                <a href="#" onclick="AstroService.logout().then(() => window.location.href='login.html'); return false;" style="color:#ef4444;text-decoration:none;font-size:1rem;display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;transition:background 0.2s;cursor:pointer;" onmouseover="this.style.background='#2d2d44'" onmouseout="this.style.background='transparent'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    <span data-i18n="nav.logout">Cikis Yap</span>
                </a>
            </nav>
        </div>
    </div>

    <script>
        // ─── GLOBALS ───
        let currentChart = null; // Yüklenen natal chart verisi

        // Her gezegen ID'sinin hangi 6 kategoriye ait yorumları içerebileceği
        // (Bir gezegen birden fazla kategoride yorumlanabilir)
        const CATEGORY_LABELS = {
            coreSelf:        'dashboard.coreSelf',
            mind:            'dashboard.mind',
            loveRelating:    'dashboard.loveRelating',
            workPath:        'dashboard.workPath',
            socialCollective:'dashboard.socialCollective',
            karmicHealing:   'dashboard.karmicHealing'
        };

        function goToPage(page) { window.location.href = page; }
        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('show'); }

        AstroService.onAuthStateChanged((user) => {
            if (user) { loadNatalChart(user); } else { window.location.replace('login.html'); }
        });

        async function loadNatalChart(user) {
            try {
                const chart = await AstroService.getNatalChart(user.uid);
                if (!chart) {
                    document.getElementById('natalContent').innerHTML = '<div class="empty-state"><p>' + i18n.t('natal.notFound') + '</p></div>';
                    return;
                }
                currentChart = chart;
                renderNatalChart(chart);
            } catch (err) {
                document.getElementById('natalContent').innerHTML = '<div class="empty-state" style="color:#ef4444;"><p>' + i18n.t('natal.loadingError') + '</p></div>';
            }
        }

        // ─── BOTTOM SHEET ───
        function openBottomSheet(title) {
            document.getElementById('bottomSheetTitle').textContent = title;
            document.getElementById('bottomSheetOverlay').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeBottomSheet(event) {
            if (!event || event.target.id === 'bottomSheetOverlay') {
                document.getElementById('bottomSheetOverlay').classList.remove('show');
                document.body.style.overflow = '';
            }
        }

        // ─── YORUM FİLTRELEME ───
        /**
         * Bir gezegen ID'sine (sun, moon, mercury...) göre tüm 6 kategorideki
         * ilgili yorumları bulur ve kategori başlıklarıyla gruplar.
         */
        function getPlanetInterpretations(planetId) {
            const result = {};
            const sections = currentChart?.interpretation?.sections;
            if (!sections) return result;

            const planetKey = planetId.toLowerCase().trim();

            for (const [catKey, catLabelKey] of Object.entries(CATEGORY_LABELS)) {
                const jsonKey = catKey === 'coreSelf' ? 'core_self'
                             : catKey === 'loveRelating' ? 'love_relating'
                             : catKey === 'workPath' ? 'work_path'
                             : catKey === 'socialCollective' ? 'social_collective'
                             : catKey === 'karmicHealing' ? 'karmic_healing'
                             : catKey;

                const items = sections[jsonKey];
                if (!Array.isArray(items)) continue;

                // Bu kategoride bu gezegenle ilgili yorumları filtrele
                const matched = items.filter(item => {
                    const itemKey = (item.key || '').toLowerCase();
                    const tags = (item.tags || []).map(t => t.toLowerCase());
                    // key: "planet.sun.sign.pisces" veya tags: ["sun", "pisces"]
                    return itemKey.includes('planet.' + planetKey + '.') || tags.includes(planetKey);
                });

                if (matched.length > 0) {
                    result[catKey] = matched;
                }
            }

            return result;
        }

        function showPlanetBottomSheet(planetId, planetDisplayName) {
            const interpretations = getPlanetInterpretations(planetId);
            const body = document.getElementById('bottomSheetBody');

            let html = '';
            let hasAny = false;

            for (const [catKey, items] of Object.entries(interpretations)) {
                hasAny = true;
                const catTitle = i18n.t(CATEGORY_LABELS[catKey]);

                html += `<div class="category-section">`;
                html += `<div class="category-section-title">${AstroService.escapeHtml(catTitle)}</div>`;

                items.forEach(item => {
                    html += `<div class="interp-card">`;
                    if (item.title) {
                        html += `<div class="interp-card-title">${AstroService.escapeHtml(item.title)}</div>`;
                    }
                    html += `<div class="interp-card-body">${AstroService.escapeHtml(item.body)}</div>`;
                    html += `</div>`;
                });

                html += `</div>`;
            }

            if (!hasAny) {
                html = `<div class="no-interpretation">
                    <p>${AstroService.escapeHtml(planetDisplayName)} için yorum bulunamadı.</p>
                </div>`;
            }

            body.innerHTML = html;
            openBottomSheet(planetDisplayName);
        }

        function renderNatalChart(chart) {
            const content = document.getElementById('natalContent');
            const esc = AstroService.escapeHtml;
            let html = '';

            // 1. Harita Görseli
            const imageUrl = chart.chart_image || chart.image_url;
            if (imageUrl) {
                html += '<div class="chart-image-wrapper"><img src="' + esc(imageUrl) + '" alt="Harita"></div>';
            }

            // 2. EVLER
            if (chart.houses && chart.houses.length > 0) {
                html += `<div class="section-card"><div class="section-title">${esc(i18n.t('natal.houses'))}</div>`;
                const houseSuffix = i18n.t('natal.houseSuffix');
                chart.houses.forEach((h, i) => {
                    const signName = i18n.translateSign(h.sign) || '-';
                    const deg = typeof h.degree === 'number' ? h.degree.toFixed(1) + '°' : '';
                    html += `<div class="house-row">${esc((i + 1) + houseSuffix)} ${esc(signName)} ${deg}</div>`;
                });
                html += '</div>';
            }

            // 3. AÇI NOKTALARI (ASC / MC / IC / DC / Vertex)
            if (chart.angles_details) {
                const angleDefs = [
                    { key: 'asc', label: i18n.t('natal.angleAsc') },
                    { key: 'mc', label: i18n.t('natal.angleMc') },
                    { key: 'ic', label: i18n.t('natal.angleIc') },
                    { key: 'dc', label: i18n.t('natal.angleDc') },
                    { key: 'vertex', label: i18n.t('natal.angleVertex') }
                ];
                const rows = angleDefs
                    .map(a => ({ ...a, data: chart.angles_details[a.key] }))
                    .filter(a => a.data);

                if (rows.length > 0) {
                    html += `<div class="section-card"><div class="section-title">${esc(i18n.t('natal.angleDetails'))}</div>`;
                    rows.forEach(a => {
                        const signName = i18n.translateSign(a.data.sign) || '-';
                        const deg = typeof a.data.degree === 'number' ? a.data.degree.toFixed(1) + '°' : '';
                        html += `<div class="planet-row" style="cursor:default;">
                                    <span style="font-weight:600;">${esc(a.label)}</span>
                                    <span style="color:#6b7280;">${esc(signName)} ${deg}</span>
                                 </div>`;
                    });
                    html += '</div>';
                }
            }

            // 4. GEZEGENLER (TIKLANABİLİR)
            const houseSuffixShort = i18n.t('natal.houseSuffix');
            const retroMark = i18n.t('natal.retrograde');

            // Burçlara göre grupla
            const planetsBySign = {};
            if (chart.planets) {
                chart.planets.forEach(p => {
                    const s = p.sign || 'Bilinmiyor';
                    if (!planetsBySign[s]) planetsBySign[s] = [];
                    planetsBySign[s].push(p);
                });
            }

            html += `<div class="section-card"><div class="section-title">${esc(i18n.t('natal.planets'))}</div>`;

            Object.keys(planetsBySign).forEach(signKey => {
                html += `<div class="sign-header">${esc(i18n.translateSign(signKey))}</div>`;

                planetsBySign[signKey].forEach(p => {
                    const planetId = p.id || p.name;
                    const planetName = esc(i18n.translatePlanet(planetId));
                    const retro = p.retrograde ? ` ${esc(retroMark)}` : '';
                    const deg = typeof p.degree === 'number' ? p.degree.toFixed(0) + '°' : '';
                    const house = p.house ? ` - ${esc(p.house + houseSuffixShort)}` : '';

                    // TIKLANABİLİR SATIR
                    html += `<div class="planet-row" onclick="showPlanetBottomSheet('${esc(planetId)}', '${planetName}')">
                                <div class="planet-name-group">
                                    <div class="planet-icon"></div>
                                    <span class="planet-name">${planetName}${retro}</span>
                                </div>
                                <div style="display:flex;align-items:center;gap:4px;">
                                    <span class="planet-details">${deg}${house}</span>
                                    <svg class="planet-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                                </div>
                             </div>`;
                });
            });

            html += '</div>';

            // 5. AÇILAR
            if (chart.aspects && chart.aspects.length > 0) {
                html += `<div class="section-card"><div class="section-title">${esc(i18n.t('natal.aspects'))}</div>`;
                chart.aspects.forEach(a => {
                    html += `<div class="planet-row" style="cursor:default;">
                                <span>${esc(i18n.translatePlanet(a.planet1 || a.p1))} - ${esc(i18n.translatePlanet(a.planet2 || a.p2))}</span>
                                <span style="color:#d4af37; font-weight:600;">${esc(i18n.translateAspect(a.type))}</span>
                             </div>`;
                });
                html += '</div>';
            }

            content.innerHTML = html;
        }
    </script>
</body>
</html>
